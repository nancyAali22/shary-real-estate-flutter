name: shary_real_estate
description: "An improved, production-quality re-implementation of the Shary real estate app's Home screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Cubit/BLoC pattern, keeps business logic out of widgets
  flutter_bloc: ^8.1.6

  # Value equality for Cubit states, prevents unnecessary rebuilds
  equatable: ^2.0.5

  # Simple service locator for dependency injection (Clean Architecture friendly)
  get_it: ^7.7.0

  # Responsive sizing (.w, .h, .sp, .r) across different screen sizes
  flutter_screenutil: ^5.9.3

  # Declarative routing between Home and placeholder screens
  go_router: ^14.6.2

  # Professional Arabic typography (Cairo/Tajawal) instead of default Roboto
  google_fonts: ^6.2.1

  # Skeleton/shimmer loading effect for professional loading states
  shimmer: ^3.0.0

  # Locale-aware number/currency formatting (prices, investment %) —
  # avoids hardcoding formatted strings as magic values in mock data
  intl: ^0.19.0

  # Crisp vector icons for Shary Ma3ak services + header actions —
  # scales cleanly across screen densities instead of raster PNGs
  flutter_svg: ^2.0.10+1

  # Professional bottom navigation: collapses inactive tabs to icon-only,
  # solving the 5-long-Arabic-labels crowding problem structurally
  # instead of shrinking font size to fit.
  google_nav_bar: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Cubit/Bloc state-sequence testing (blocTest) — dev-only, no runtime impact
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/