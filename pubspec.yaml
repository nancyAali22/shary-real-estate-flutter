name: shary_real_estate
description: "An improved, production-quality re-implementation of the Shary real estate app's Home screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — Cubit/BLoC pattern, keeps business logic out of widgets
  flutter_bloc: ^8.1.6

  # Value equality for Cubit states, prevents unnecessary rebuilds
  equatable: ^2.0.5

  # Simple service locator for dependency injection (Clean Architecture friendly)
  get_it: ^7.7.0

  # Responsive sizing (.w, .h, .sp, .r) across different screen sizes
  flutter_screenutil: ^5.9.3

  # Declarative routing between Home and placeholder screens
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true